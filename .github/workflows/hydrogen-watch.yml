name: Pegasus Hydrogen Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  issues: write

jobs:
  hydrogen-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pegasus
        uses: actions/checkout@v4

      - name: Run hydrogen intelligence scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python hydrogen_watch.py
